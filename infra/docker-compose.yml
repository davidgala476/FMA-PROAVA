services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:15
    container_name: fmaproava_postgres
    environment:
      POSTGRES_DB: fmaproava_dept
      POSTGRES_USER: alchemist
      POSTGRES_PASSWORD: equivalent_exchange
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alchemist -d fmaproava_dept"]
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 30s
    networks:
      - fmaproava_network

  # Redis para cache y sesiones
  redis:
    image: redis:7-alpine
    container_name: fmaproava_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - fmaproava_network

  # Cola de mensajes RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: fmaproava_rabbitmq
    ports:
      - "5672:5672"   # Puerto de aplicación
      - "15672:15672" # Puerto de administración (Web UI)
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_ERLANG_COOKIE: fmaproava_rabbit_secret
    user: "999:999"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - fmaproava_network

  # Backend API principal
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: fmaproava_backend
    ports:
      - "8080:8080"
    environment:
      # Base de datos
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=alchemist
      - DB_PASS=equivalent_exchange
      - DB_NAME=fmaproava_dept
      # Redis
      - REDIS_ADDR=redis:6379
      # RabbitMQ
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672
      # Seguridad
      - JWT_SECRET=fmaproava_super_secret_jwt_key_2024
      # Servidor
      - SERVER_PORT=8080
      - SERVER_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fmaproava_network

  # Workers para procesamiento asíncrono
  workers:
    build:
      context: ../backend
      dockerfile: Dockerfile.workers
    container_name: fmaproava_workers
    environment:
      # Base de datos
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=alchemist
      - DB_PASS=equivalent_exchange
      - DB_NAME=fmaproava_dept
      # Redis
      - REDIS_ADDR=redis:6379
      # RabbitMQ
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672
      # Workers
      - WORKERS_ENABLED=true
      - WORKER_TRANSMUTATION=true
      - WORKER_AUDIT=true
      - WORKER_DAILY_CHECKS=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fmaproava_network

  # Frontend Next.js
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8080/api"
        NEXT_PUBLIC_WS_URL: "ws://localhost:8080/ws"
    container_name: fmaproava_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080/ws
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - fmaproava_network

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  fmaproava_network:
    driver: bridge